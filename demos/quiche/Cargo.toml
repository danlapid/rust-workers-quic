# The quiche demo is a member of the repository workspace. The run script
# configures boring-sys to compile its bundled BoringSSL for wasm.
[package]
name = "quiche-demo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "quiche-demo"
path = "src/main.rs"

[dependencies]
# wasm-bindgen comes from Guy's fork with the repository's single source patch.
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true

# The async substrate: the emscripten tokio (net = reactor UdpSocket + async DNS).
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
] }

# Cloudflare's Tokio adapter drives quiche and HTTP/3 over the standard Tokio
# UdpSocket. Keep its default features enabled so the complete crate is tested.
tokio-quiche = "0.19.1"

anyhow = "1"
