# The quiche QUIC demo crate. Like the quinn demo (`../quinn_h3/`), it builds
# inside the patched workers-rs workspace (for the wasm-bindgen fork), copied in
# by `scripts/run-quiche.sh`. It also needs BoringSSL-for-wasm + the boring-sys
# bindgen env (see patches/quiche-boringssl/). Not a standalone `cargo build`.
[package]
name = "quiche-demo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "quiche-demo"
path = "src/main.rs"

[dependencies]
# wasm-bindgen family come from the workers-rs workspace (patched fork).
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true

# The async substrate: the emscripten tokio (net = reactor UdpSocket + async DNS).
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
] }

# QUIC + HTTP/3 via Cloudflare's quiche, on BoringSSL through the `boring` crate.
# quiche is sans-I/O: we drive send()/recv() over the emscripten tokio UdpSocket
# ourselves, so no platform UDP code is involved. This path is rewritten to an
# absolute vendor path by scripts/run-quiche.sh when copied into the workspace.
# `boring` is pulled transitively by quiche (its own workspace path dep).
quiche = { path = "../../vendor/quiche/quiche", default-features = false, features = [
    "boringssl-boring-crate",
] }

anyhow = "1"

[profile.release]
opt-level = "s"
