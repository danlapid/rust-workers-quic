# The quiche demo is a member of the repository workspace. The run script
# configures boring-sys to compile its bundled BoringSSL for wasm.
[package]
name = "quiche-demo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "quiche-demo"
path = "src/main.rs"

[dependencies]
# wasm-bindgen comes from Guy's fork with the repository's single source patch.
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true

# The async substrate: the emscripten tokio (net = reactor UdpSocket + async DNS).
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
] }

# QUIC + HTTP/3 via Cloudflare's quiche, on BoringSSL through the `boring` crate.
# quiche is sans-I/O: we drive send()/recv() over the emscripten tokio UdpSocket
# ourselves, so no platform UDP code is involved. This revision includes the
# wasm-correct C void FFI declarations from upstream PR #2535.
quiche = { git = "https://github.com/cloudflare/quiche", rev = "68c23b9dd16068c5b77fbb4d232c92e8bd23505e", default-features = false, features = [
    "boringssl-boring-crate",
] }

anyhow = "1"
