# The QUIC demo is a member of the repository workspace, which references the
# pinned dependency checkouts created by scripts/setup.sh.
[package]
name = "quic-demo"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "quic-demo"
path = "src/main.rs"

[dependencies]
# wasm-bindgen comes from Guy's patched fork.
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true

# The async substrate: the emscripten tokio (net = reactor UdpSocket + async DNS).
tokio = { version = "1", default-features = false, features = [
    "rt",
    "macros",
    "net",
] }

# QUIC. `rustls-ring` selects the ring crypto backend (aws-lc-rs is intractable
# on emscripten). The patched quinn-udp uses its basic socket fallback.
quinn = { version = "0.11", default-features = false, features = [
    "rustls-ring",
    "runtime-tokio",
] }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
] }

# HTTP/3 on top of quinn (h3-quinn 0.0.10 targets quinn 0.11.7+).
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
bytes = "1"

anyhow = "1"
